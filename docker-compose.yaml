services:
  # the search engine
  elastic:
    restart: "no"
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.27
    container_name: nomad_elastic
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.flood_stage=1gb
      - cluster.routing.allocation.disk.watermark.low=4gb
      - cluster.routing.allocation.disk.watermark.high=2gb
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - 9200:9200
    volumes:
      - nomad_elastic:/usr/share/elasticsearch/data

  # the user data db
  mongo:
    restart: "no"
    image: mongo:5.0.6
    container_name: nomad_mongo
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
    ports:
      - 27017:27017
    volumes:
      - nomad_mongo:/data/db
      - nomad_mongo_config:/data/configdb
    command: mongod
    # --logpath=/dev/null # --quiet

  temporal:
    container_name: nomad_temporal
    image: temporalio/temporal:1.6.1
    command: server start-dev --ip 0.0.0.0
    volumes:
      - nomad_temporal:/data
    ports:
      - 7233:7233
      - 8080:8233

  north:
    profiles: ["north"]
    restart: unless-stopped
    image: ghcr.io/fairmat-nfdi/nomad-north:main
    platform: linux/amd64
    container_name: nomad_oasis_north
    environment:
      NOMAD_API_URL: "http://host.docker.internal:8000/nomad-oasis/api/v1"
      DOCKER_PREFIX: "nomad-oasis-north"
      DOCKER_NETWORK: "nomad_oasis_network"
    env_file:
      - ./.env.north
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:rw"
      - "nomad_north:/data"
    ports:
      - 9000:9000
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:9000/nomad-oasis/north/hub/health",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

volumes:
  nomad_mongo:
  nomad_mongo_config:
  nomad_elastic:
  nomad_temporal:
  nomad_north:

networks:
  default:
    name: nomad_oasis_network
